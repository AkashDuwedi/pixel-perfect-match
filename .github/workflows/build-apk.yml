name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          npm install --no-save @capacitor/core@^8.5.2 @capacitor/cli@^8.5.2 @capacitor/android@^8.5.2 @capacitor/assets
          mkdir -p dist assets
          echo '<!doctype html><title>Vedaalay</title>' > dist/index.html
          cp app-icon.png assets/icon-only.png
          cp app-icon.png assets/icon-foreground.png
          cp app-icon.png assets/icon-background.png
          cp app-splash.png assets/splash.png
          cp app-splash.png assets/splash-dark.png
          npx cap sync android
          npx capacitor-assets generate --android
      - run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: vedaalay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
